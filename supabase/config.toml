project_id = "careflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://*.pages.dev"]
jwt_expiry = 3600
enable_signup = false  # invitation-only — no public self-registration (docs/architecture.md)

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
